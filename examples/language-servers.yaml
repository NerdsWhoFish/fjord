languageServers:
  python:
    command:
      - node
      - --openssl-config=/dev/null
      - /opt/fjord/languages/node_modules/pyright/langserver.index.js
      - --stdio
    files: ["**/*.py", "**/*.pyi"]
    languageId: python
    rootMarkers: [pyproject.toml, pyrightconfig.json, setup.py]
    runtimePaths: [/opt/fjord/languages]
    settings:
      python:
        analysis:
          typeCheckingMode: strict
          diagnosticMode: openFilesOnly
