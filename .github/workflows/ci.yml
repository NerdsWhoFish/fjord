name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      FJORD_TEST_GOPLS: '1'
      FJORD_TEST_TOFU_LS: '1'
      FJORD_TEST_NODE_LSP: '1'
      FJORD_LANGUAGE_BUNDLE: ${{ github.workspace }}/languages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            languages/package-lock.json
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - name: Validate Helm chart
        env:
          FJORD_TEST_HELM: "1"
        run: go test ./charts/fjord/tests -count=1
      - name: Select Chrome for extension packaging tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "CHROME_BIN=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
          else
            echo "CHROME_BIN=google-chrome" >> "$GITHUB_ENV"
          fi
      - name: Install language servers
        run: |
          sh scripts/install-language-servers.sh
          sh scripts/install-node-language-servers.sh
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: make check build
