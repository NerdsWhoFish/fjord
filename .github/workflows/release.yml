name: Release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to cut
        type: choice
        default: Release
        options: [Release, Release Candidate]
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Validate packaging without publishing or creating a tag
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fjord-release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GOWORK: "off"
      CHROME_BIN: google-chrome
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Prepare extension signing key
        env:
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          FJORD_EXTENSION_SIGNING_KEY: ${{ secrets.FJORD_EXTENSION_SIGNING_KEY }}
        run: node scripts/prepare-extension-key.mjs
      - name: Cut release with Quill
        uses: NerdsWhoFish/quill@v1
        with:
          scope: ${{ inputs.scope }}
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          release-branch: refs/heads/main
          major-alias: "false"
          publish: goreleaser,docker
          docker-images: ghcr.io/nerdswhofish/fjord
          docker-platforms: linux/amd64,linux/arm64
          docker-build-args: |
            APP_VERSION=${{ github.sha }}
      - name: Keep dry-run artifacts
        if: inputs.dry-run
        uses: actions/upload-artifact@v4
        with:
          name: fjord-release-dry-run
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            artifacts/fjord-chrome-extension.zip
            artifacts/fjord-chrome-extension.crx
          if-no-files-found: error
      - name: Remove extension signing key
        if: always()
        run: node scripts/prepare-extension-key.mjs --cleanup
