name: Publish Helm chart

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      bootstrap:
        default: false
        type: boolean
    secrets:
      HELM_APP_ID:
        required: true
      HELM_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published application release to package
        required: true
        default: v1.0.0
        type: string
      bootstrap:
        description: Use current chart for v1.0.0, which predates chart source
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fjord-chart-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate chart
        env:
          GOWORK: "off"
          FJORD_TEST_HELM: "1"
        run: go test ./charts/fjord/tests -count=1
      - name: Verify release and package chart
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "::error::Expected a stable or release-candidate version tag"
            exit 1
          }
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          source="$RUNNER_TEMP/chart-source"
          mkdir -p "$source"
          if git cat-file -e FETCH_HEAD:charts/fjord/Chart.yaml 2>/dev/null; then
            git archive FETCH_HEAD charts/fjord | tar -x -C "$source"
            source="$source/charts/fjord"
          elif [[ "$BOOTSTRAP" == true && "$RELEASE_TAG" == v1.0.0 ]]; then
            source=charts/fjord
          else
            echo "::error::The selected release has no chart source"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          helm lint "$source" --strict
          helm package "$source" --version "$version" --app-version "$version" --destination artifacts
          echo "path=artifacts/fjord-$version.tgz" >> "$GITHUB_OUTPUT"
      - name: Submit package to the Helm repository
        uses: NerdsWhoFish/helm-charts/publish@590c20f94ad38343435c0fdd1dde8832029e535a
        with:
          package: ${{ steps.package.outputs.path }}
          app-id: ${{ secrets.HELM_APP_ID }}
          app-private-key: ${{ secrets.HELM_APP_PRIVATE_KEY }}
