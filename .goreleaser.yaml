version: 2
project_name: fjord

before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build
    - >-
      node extension/package.mjs artifacts/fjord-chrome-extension.zip
      --version {{ if .IsSnapshot }}0.0.0-rc.1{{ else }}{{ .Version }}{{ end }}
      --crx artifacts/fjord-chrome-extension.crx

builds:
  - id: fjord
    main: ./cmd/fjord
    binary: fjord
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: fjord
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: examples/language-servers.yaml
        dst: examples
      - src: scripts/install-language-servers.sh
        dst: scripts
      - src: scripts/install-node-language-servers.sh
        dst: scripts
      - src: languages/package.json
        dst: languages
      - src: languages/package-lock.json
        dst: languages
      - src: languages/README.md
        dst: languages

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: artifacts/fjord-chrome-extension.zip
    - glob: artifacts/fjord-chrome-extension.crx

release:
  prerelease: auto
  extra_files:
    - glob: artifacts/fjord-chrome-extension.zip
    - glob: artifacts/fjord-chrome-extension.crx

changelog:
  use: git
  sort: asc
